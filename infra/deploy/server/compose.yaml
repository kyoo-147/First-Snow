name: agentkid-prod

services:
  caddy:
    image: caddy:2.11.2
    container_name: agentkid-caddy
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  web:
    # WEB_IMAGE must be available to Compose itself via `--env-file`.
    # These repo files are bootstrap assets: `infra/deploy/server/compose.yaml`
    # is copied to `/opt/agentkid/compose.yaml`, and `web.env.template` becomes
    # `/opt/agentkid/web.env` before runtime. `env_file: ./web.env` is then
    # resolved safely relative to the deployed `/opt/agentkid/compose.yaml`.
    image: ${WEB_IMAGE}
    container_name: agentkid-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./web.env
    # Best-effort healthcheck: this assumes the web image is Node-based,
    # which matches the current Next.js web runtime but is not enforced by
    # the bootstrap contract itself.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then((res)=>process.exit([200,301,302].includes(res.status)?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    expose:
      - "3000"

  postgres:
    image: pgvector/pgvector:pg16
    container_name: agentkid-postgres
    restart: unless-stopped
    env_file:
      - ./db.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    expose:
      - "5432"

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
